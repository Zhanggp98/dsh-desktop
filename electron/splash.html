<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek Harness</title>
<style>
  /* ===== 主题变量（默认深色） ===== */
  :root {
    --bg-grad: linear-gradient(165deg, #0a1120 0%, #0e1d3a 48%, #132a52 100%);
    --text-title: #f1f5f9;
    --text-status: #94a3b8;
    --spinner-ring: rgba(255, 255, 255, .16);
    --spinner-front: #4f8cff;
    --version-color: #4b5e7d;
    --logo-filter: brightness(0) invert(1);
    --glow: rgba(79, 140, 255, .16);
  }
  :root[data-theme="light"] {
    --bg-grad: linear-gradient(165deg, #f8fafc 0%, #eef2f7 48%, #e3ebf9 100%);
    --text-title: #0f172a;
    --text-status: #64748b;
    --spinner-ring: rgba(15, 23, 42, .14);
    --spinner-front: #4f8cff;
    --version-color: #94a3b8;
    --logo-filter: none;
    --glow: rgba(37, 99, 235, .12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-grad);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text-title);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; overflow: hidden; user-select: none;
    -webkit-app-region: drag;
    transition: background .3s ease;
  }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo-wrap {
    width: 110px; height: 110px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, var(--glow), transparent 70%);
    border-radius: 50%;
  }
  .logo {
    width: 82px; height: 82px;
    filter: var(--logo-filter);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: .95; }
    50% { transform: scale(1.07); opacity: 1; }
  }
  .title { font-size: 20px; font-weight: 600; color: var(--text-title); letter-spacing: 1px; }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--spinner-ring);
    border-top-color: var(--spinner-front);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-top: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    font-size: 13px; color: var(--text-status); text-align: center;
    min-height: 20px; padding: 0 28px; margin-top: 4px;
    transition: color .25s ease;
  }
  .status .fade { animation: fadein .35s ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }

  .version {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--version-color);
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo-wrap"><img class="logo" src="../build/icon.png" alt="DeepSeek Harness" /></div>
    <div class="title">DeepSeek Harness</div>
  </div>
  <div class="spinner"></div>
  <div class="status"><span id="status" class="fade">正在启动…</span></div>
  <div class="version">v0.1.0</div>
  <script>
    // 主题切换：light | dark（由主进程调用）
    window.__setTheme = function (theme) {
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    };
    // 更新单行状态文字（带淡入动画）
    window.__setStatus = function (text) {
      var el = document.getElementById('status');
      el.textContent = text;
      el.classList.remove('fade');
      void el.offsetWidth;
      el.classList.add('fade');
    };
  </script>
</body>
</html>
